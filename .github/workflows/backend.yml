# يتأكد أن الـ backend يُبنى وأن كل المسارات تعمل (اختبار شامل على قاعدة بيانات وهمية — بدون Supabase)
name: Backend build + smoke test
on:
  push: { branches: [main], paths: ["backend/**", "content/**"] }
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - working-directory: backend
        run: |
          npm ci || npm i
          npm run test:smoke
